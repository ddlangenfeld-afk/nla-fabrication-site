<!DOCTYPE html><html><head><style>
body{margin:0;background:#0b0c0e;display:grid;grid-template-columns:1fr 1fr;gap:2px}
canvas{display:block}
.lab{position:absolute;color:#f5a524;font:12px monospace;padding:4px}
</style>
<script type="importmap">
{"imports":{"three":"/node_modules/three/build/three.module.js","three/addons/":"/node_modules/three/examples/jsm/"}}
</script></head><body>
<script type="module">
import * as THREE from 'three';
import { OBJLoader } from 'three/addons/loaders/OBJLoader.js';

const views = [
  {name:'ISO',   pos:[34, 26, 34]},
  {name:'FRONT', pos:[0, 10, 46]},
  {name:'SIDE',  pos:[46, 10, 0]},
  {name:'BOTTOM',pos:[16, -34, 22]},
];
const obj = await new OBJLoader().loadAsync('/design/hvac-slider-knob.obj');
const mat = new THREE.MeshStandardMaterial({color:0x2a2d33, metalness:0.25, roughness:0.55, side:THREE.DoubleSide});
obj.traverse(c=>{ if(c.isMesh) c.material = mat; });

for (const v of views) {
  const r = new THREE.WebGLRenderer({antialias:true});
  r.setSize(700, 520); r.setClearColor(0x0b0c0e);
  document.body.appendChild(r.domElement);
  const lab = document.createElement('div'); lab.className='lab'; lab.textContent=v.name;
  document.body.appendChild(lab);
  const sc = new THREE.Scene();
  sc.add(new THREE.AmbientLight(0xffffff, 0.55));
  const d1 = new THREE.DirectionalLight(0xffffff, 2.2); d1.position.set(20,30,25); sc.add(d1);
  const d2 = new THREE.DirectionalLight(0x7cc7ff, 0.9); d2.position.set(-25,5,-20); sc.add(d2);
  const cam = new THREE.PerspectiveCamera(35, 700/520, 0.1, 500);
  cam.position.set(...v.pos); cam.lookAt(0, 10, 8);
  const g = obj.clone(); g.position.set(0,0,-8); sc.add(g);
  // wireframe overlay so topology is visible
  const wf = new THREE.LineSegments(
    new THREE.WireframeGeometry(g.children[0].geometry),
    new THREE.LineBasicMaterial({color:0xf5a524, transparent:true, opacity:0.16}));
  wf.position.copy(g.position); sc.add(wf);
  r.render(sc, cam);
}
window.__done = true;
</script></body></html>
